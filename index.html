<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway Racing V4.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         GAME CONTAINER
    ========================== -->
    <div id="gameContainer">

        <!-- Road (Generated with Canvas) -->
        <canvas id="roadCanvas"></canvas>

        <!-- Enemy Vehicles -->
        <div id="trafficLayer"></div>

        <!-- Player Vehicle -->
        <div id="playerLayer">
            <img
                id="playerCar"
                src="assets/cars/Player_Car.png"
                alt="Player Car">
        </div>

        <!-- =========================
             TOP HUD
        ========================== -->
        <header id="topHUD">

            <div class="hudBox">
                <span class="title">SCORE</span>
                <span id="score">0</span>
            </div>

            <div class="hudBox">
                <span class="title">BEST</span>
                <span id="bestScore">0</span>
            </div>

        </header>

        <!-- =========================
             BOTTOM DASHBOARD
        ========================== -->
        <footer id="dashboard">

            <!-- Steering -->
            <div id="steeringSection">

                <div id="steeringWheel">

                </div>

            </div>

            <!-- Center Info -->
            <div id="centerPanel">

                <div class="info">

                    <span>GEAR</span>

                    <div id="gearBox">

                        <span>P</span>
                        <span>R</span>
                        <span>N</span>
                        <span class="activeGear">D</span>

                    </div>

                </div>

                <div class="info">

                    <span>RPM</span>

                    <div id="rpmBar">

                        <div id="rpmFill"></div>

                    </div>

                </div>

            </div>

            <!-- Speedometer -->
            <div id="speedSection">

                <canvas id="speedometer"></canvas>

                <div id="speedText">

                    <span id="speedValue">0</span>

                    <small>km/h</small>

                </div>

            </div>

        </footer>

        <!-- =========================
             START SCREEN
        ========================== -->
        <section id="startScreen">

            <h1>HIGHWAY RACING</h1>

            <button id="startBtn">
                START GAME
            </button>

        </section>

        <!-- =========================
             GAME OVER
        ========================== -->
        <section id="gameOverScreen">

            <h1>GAME OVER</h1>

            <p>
                Final Score :
                <span id="finalScore">0</span>
            </p>

            <button id="restartBtn">

                PLAY AGAIN

            </button>

        </section>

    </div>

    <script src="script.js"></script>

    <div id="countdown">3</div>

</body>

</html>
